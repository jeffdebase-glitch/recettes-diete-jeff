name: Recipe image relay

on:
  push:
    branches:
      - recipe-upload-brownie-mug-cake

permissions:
  contents: write

jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download recipe image
        run: |
          mkdir -p images
          curl --fail --location 'https://cdn.openart.ai/openart-uploads/production/attachment-transfers/600ccee05070e867773fb1c64e0c933be3fee22fef9c5528f9ad32e3e892536d.jpg' -o images/brownie-mug-cake-proteine-avoine.jpg
          test "$(stat -c%s images/brownie-mug-cake-proteine-avoine.jpg)" -gt 10000
          file images/brownie-mug-cake-proteine-avoine.jpg | grep -qi 'JPEG image data'

      - name: Commit recipe image
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add images/brownie-mug-cake-proteine-avoine.jpg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat: ajoute photo brownie mug cake protéiné'
          git push
