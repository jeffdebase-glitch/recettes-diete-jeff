name: Import flan compote image
on:
  push:
    paths:
      - '.github/workflows/import-flan-compote.yml'
permissions:
  contents: write
jobs:
  import-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and validate JPEG
        run: |
          mkdir -p images
          curl -fL --retry 3 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-b22c-81f4-8931-6b65bf623162/raw?se=2026-11-01T12%3A58%3A44Z&sp=r&sv=2026-02-06&sr=b&scid=eb84dba4-d1bb-551c-8d80-452a21781baa&skoid=002823aa-689d-47ca-9347-108c20f4f00d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-01T10%3A51%3A37Z&ske=2026-11-02T10%3A51%3A37Z&sks=b&skv=2026-02-06&sig=6USmBZ3LNrPqM9EjyKMGc4cz4F6B2Kkl1zZ3mNVWDrc%3D' -o images/flan-proteine-fromage-blanc-compote.jpg
          test "$(xxd -p -l 2 images/flan-proteine-fromage-blanc-compote.jpg)" = "ffd8"
          test "$(tail -c 2 images/flan-proteine-fromage-blanc-compote.jpg | xxd -p)" = "ffd9"
          test "$(stat -c%s images/flan-proteine-fromage-blanc-compote.jpg)" -gt 10000
      - name: Commit image and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/import-flan-compote.yml
          git add images/flan-proteine-fromage-blanc-compote.jpg .github/workflows/import-flan-compote.yml
          git commit -m "feat: ajoute photo flan protéiné fromage blanc compote"
          git push
